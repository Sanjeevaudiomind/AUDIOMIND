<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - Audiomind Speech and Hearing LLP</title>
    <link rel="icon" href="images/logo.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <a href="index.html"><img src="images/logo.png" alt="Audiomind Logo"></a>
            </div>
            <ul class="nav-links">
                <li><a href="index.html#about">About Us</a></li>
                <li><a href="index.html#services">Services</a></li>
                <li><a href="index.html#doctors">Our Doctors</a></li>
                <li><a href="index.html#gallery">Gallery</a></li>
                <li><a href="index.html#testimonials">Testimonials</a></li>
                <li><a href="index.html#contact">Contact Us</a></li>
            </ul>
            <div class="burger">
                <div class="line1"></div>
                <div class="line2"></div>
                <div class="line3"></div>
            </div>
        </nav>
    </header>

    <main>
        <section id="full-gallery">
            <div class="container">
                <h2>Gallery</h2>
                <div class="full-gallery-grid">
                    <img src="images/image1.png" alt="Gallery Image 1" class="full-gallery-img">
                    <img src="images/image2.png" alt="Gallery Image 2" class="full-gallery-img">
                    <img src="images/image3.png" alt="Gallery Image 3" class="full-gallery-img">
                    <img src="images/image4.png" alt="Gallery Image 4" class="full-gallery-img">
                    <img src="images/services.jpeg" alt="Services Image" class="full-gallery-img">
                    <img src="images/doctor1.png" alt="Doctor 1" class="full-gallery-img">
                    <img src="images/doctor2.png" alt="Doctor 2" class="full-gallery-img">
                </div>
            </div>
        </section>
    </main>

    <div id="lightbox" class="lightbox">
        <span class="close-lightbox">&times;</span>
        <img class="lightbox-content" id="lightbox-img">
    </div>

    <footer>
        <div class="container">
            <p>&copy; 2026 Audiomind Speech and Hearing LLP. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
